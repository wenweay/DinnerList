<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinner with me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff4ec;
    --card: #ffffff;
    --ink: #3b2a2a;
    --muted: #8a7270;
    --accent: #ff6b6b;
    --accent-dark: #e85151;
    --soft: #ffe1d6;
    --line: #f3d6cc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 20%, #ffe3d3 0, transparent 40%),
      radial-gradient(circle at 85% 80%, #ffd9e0 0, transparent 40%),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border-radius: 28px;
    padding: 40px 32px 32px;
    box-shadow: 0 18px 50px -20px rgba(200, 90, 80, .35), 0 2px 0 var(--line);
    text-align: center;
    position: relative;
  }
  .step { display: none; animation: pop .45s cubic-bezier(.2,.9,.3,1.3); }
  .step.active { display: block; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }
  .face { width: 96px; height: 96px; margin: 0 auto 18px; display: block; }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .shake { animation: shake .6s ease-in-out 2; }
  @keyframes shake { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

  h1 {
    font-weight: 600;
    font-size: 1.6rem;
    line-height: 1.3;
    margin: 0 0 26px;
  }
  h1 .hand { font-family: "Caveat", cursive; font-size: 2.1rem; color: var(--accent); display: block; }

  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 500;
    font-size: 1.05rem;
    border: none;
    border-radius: 999px;
    padding: 13px 26px;
    cursor: pointer;
    transition: transform .15s, background .15s, box-shadow .15s;
  }
  button:active { transform: scale(.96); }
  .primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 0 var(--accent-dark);
  }
  .primary:hover { background: var(--accent-dark); }
  .ghost {
    background: var(--soft);
    color: var(--ink);
    box-shadow: 0 4px 0 var(--line);
  }
  .ghost:hover { background: #ffd2c3; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .options { display: grid; gap: 10px; text-align: left; margin-bottom: 20px; }
  .opt {
    display: flex; align-items: center; gap: 14px;
    width: 100%;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 14px 18px;
    box-shadow: none;
    text-align: left;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: #fff1ee; }
  .opt .emoji { font-size: 1.6rem; width: 32px; text-align: center; }
  .opt .num { color: var(--muted); font-size: .9rem; margin-left: auto; }

  textarea, input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    outline: none;
    resize: none;
    background: #fffaf7;
    transition: border-color .15s;
  }
  textarea:focus, input[type="text"]:focus { border-color: var(--accent); }
  #otherBox { display: none; margin: -4px 0 18px; }
  #otherBox.show { display: block; animation: pop .35s ease; }
  .field { margin-bottom: 20px; }

  .sub { color: var(--muted); margin: -14px 0 24px; font-size: 1rem; }

  .summary {
    margin: 22px 0 0;
    background: #fff8f4;
    border: 1.5px dashed var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    text-align: left;
    font-size: .95rem;
    color: var(--muted);
  }
  .summary b { color: var(--ink); font-weight: 500; }
  .status { margin-top: 14px; font-size: .92rem; color: var(--muted); min-height: 1.2em; }
  .status.ok { color: #3a9a63; }
  .link {
    background: none; box-shadow: none; padding: 6px 10px;
    color: var(--muted); font-size: .9rem; margin-top: 16px;
  }
  .link:hover { color: var(--accent); }
  .copy { margin-top: 10px; font-size: .95rem; padding: 10px 20px; }
  [hidden] { display: none !important; }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti span {
    position: absolute; top: -20px; font-size: 22px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .8; } }

</style>
</head>
<body>

<main class="card">

  <!-- Step 1 -->
  <section class="step active" id="s-start">
    <svg class="face bob" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="#ffd36b"/>
      <circle cx="35" cy="44" r="5" fill="#3b2a2a"/>
      <circle cx="65" cy="44" r="5" fill="#3b2a2a"/>
      <circle cx="27" cy="58" r="6" fill="#ff9b9b" opacity=".7"/>
      <circle cx="73" cy="58" r="6" fill="#ff9b9b" opacity=".7"/>
      <path d="M36 62 Q50 74 64 62" stroke="#3b2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>Do you want to have a dinner with me?</h1>
    <div class="btns">
      <button class="primary" onclick="go('s-food')">Yesss</button>
      <button class="ghost" onclick="state.saidNo = true; go('s-sure')">Nooo</button>
    </div>
  </section>

  <!-- Step 2: Nooo -->
  <section class="step" id="s-sure">
    <svg class="face shake" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="#ffd36b"/>
      <path d="M28 42 Q35 38 42 42" stroke="#3b2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M58 42 Q65 38 72 42" stroke="#3b2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M38 68 Q50 58 62 68" stroke="#3b2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="33" cy="54" rx="4" ry="7" fill="#7cc7ff"/>
    </svg>
    <h1>Are you sureeee?<span class="hand">I'll be very sad</span></h1>
    <div class="btns">
      <button class="primary" onclick="go('s-food')">Okay, I'll come</button>
      <button class="ghost" onclick="declined()">I don't care</button>
    </div>
  </section>

  <!-- Step 2b: I don't care -->
  <section class="step" id="s-fine">
    <svg class="face" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="#ffd36b"/>
      <path d="M28 44 H42" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/>
      <path d="M58 44 H72" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 66 H60" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>Fine...</h1>
    <button class="link" onclick="restart()">↺ start over</button>
  </section>

  <!-- Step 3: food -->
  <section class="step" id="s-food">
    <h1>What do you want?</h1>
    <div class="options" role="radiogroup">
      <button class="opt" data-food="Dumplings"><span class="emoji">🥟</span>Dumplings<span class="num">1</span></button>
      <button class="opt" data-food="Ossobuco"><span class="emoji">🍖</span>Ossobuco<span class="num">2</span></button>
      <button class="opt" data-food="Pizza"><span class="emoji">🍕</span>Pizza<span class="num">3</span></button>
      <button class="opt" data-food="other"><span class="emoji">💭</span>I have other ideas<span class="num">4</span></button>
    </div>
    <div id="otherBox">
      <textarea id="otherText" rows="2" placeholder="Tell me your idea…"></textarea>
    </div>
    <button class="primary" id="foodNext" disabled onclick="go('s-day')">Next →</button>
  </section>

  <!-- Step 4: day -->
  <section class="step" id="s-day">
    <svg class="face bob" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="14" y="20" width="72" height="66" rx="12" fill="#fff" stroke="#ff6b6b" stroke-width="4"/>
      <rect x="14" y="20" width="72" height="18" rx="10" fill="#ff6b6b"/>
      <rect x="30" y="12" width="6" height="16" rx="3" fill="#3b2a2a"/>
      <rect x="64" y="12" width="6" height="16" rx="3" fill="#3b2a2a"/>
      <path d="M50 76 C38 66 34 60 38 54 C42 48 48 50 50 55 C52 50 58 48 62 54 C66 60 62 66 50 76Z" fill="#ff6b6b"/>
    </svg>
    <h1>Perfect!</h1>
    <p class="sub">Tell me which day do you want, I'm always available for you.</p>
    <div class="field">
      <input type="text" id="dayText" placeholder="e.g. Friday evening" autocomplete="off">
    </div>
    <button class="primary" id="dayNext" disabled onclick="finish()">Done ✓</button>
  </section>

  <!-- Step 5: end -->
  <section class="step" id="s-end">
    <svg class="face bob" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="#ffd36b"/>
      <path d="M28 44 Q35 36 42 44" stroke="#3b2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M58 44 Q65 36 72 44" stroke="#3b2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="27" cy="58" r="6" fill="#ff9b9b" opacity=".8"/>
      <circle cx="73" cy="58" r="6" fill="#ff9b9b" opacity=".8"/>
      <path d="M32 58 Q50 82 68 58 Z" fill="#3b2a2a"/>
    </svg>
    <h1>Thank you for your time,<span class="hand">can't wait!</span></h1>
    <div class="summary" id="summary"></div>
    <div class="status" id="status"></div>
    <button class="ghost copy" id="copyBtn" hidden onclick="copySummary()">Copy my answer</button>
    <br>
    <button class="link" onclick="restart()">↺ start over</button>
  </section>

</main>

<div class="confetti" id="confetti"></div>

<script>
  const state = { food: null, saidNo: false };

  /* ---------- CONFIG ----------
     Paste your Google Apps Script web app URL here (ends in /exec). */
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvRLtfiic1M4WKGinWYWKO0tLyFd7A2cmVtxmPKRw1vgfNQmu-d7KRqFoKKHGp8_5FBA/exec";

  /* Optional: send each friend a personal link like  ...?name=Anna
     so you know who answered. */
  const FRIEND_NAME = (new URLSearchParams(location.search).get("name") || "").trim();

  async function saveAnswer(data) {
    if (!SCRIPT_URL || SCRIPT_URL.indexOf("/exec") === -1) return false;
    try {
      // text/plain + no-cors = a "simple" request Apps Script accepts from any site
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ name: FRIEND_NAME, ...data })
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ---------- navigation ---------- */
  function go(id) {
    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    const el = document.getElementById(id);
    el.querySelectorAll(".bob, .shake").forEach(f => { f.style.animation = "none"; f.offsetHeight; f.style.animation = ""; });
    el.classList.add("active");
    if (id === "s-day") setTimeout(() => document.getElementById("dayText").focus(), 50);
  }

  function declined() {
    go("s-fine");
    saveAnswer({ coming: false, saidNoFirst: true });
  }

  /* ---------- food ---------- */
  const opts = document.querySelectorAll(".opt");
  const otherBox = document.getElementById("otherBox");
  const otherText = document.getElementById("otherText");
  const foodNext = document.getElementById("foodNext");

  function updateFoodNext() {
    foodNext.disabled = !state.food || (state.food === "other" && !otherText.value.trim());
  }
  opts.forEach(o => o.addEventListener("click", () => {
    opts.forEach(x => x.classList.remove("selected"));
    o.classList.add("selected");
    state.food = o.dataset.food;
    if (state.food === "other") {
      otherBox.classList.add("show");
      otherText.focus();
    } else {
      otherBox.classList.remove("show");
    }
    updateFoodNext();
  }));
  otherText.addEventListener("input", updateFoodNext);

  /* ---------- day ---------- */
  const dayText = document.getElementById("dayText");
  const dayNext = document.getElementById("dayNext");
  dayText.addEventListener("input", () => { dayNext.disabled = !dayText.value.trim(); });
  dayText.addEventListener("keydown", e => { if (e.key === "Enter" && !dayNext.disabled) finish(); });

  function foodLabel() {
    return state.food === "other" ? otherText.value.trim() : state.food;
  }
  function summaryText() {
    return `Yes to dinner! 🍽️\nFood: ${foodLabel()}\nDay: ${dayText.value.trim()}`;
  }

  async function finish() {
    const s = document.getElementById("summary");
    s.innerHTML = "";
    [["Food", foodLabel()], ["Day", dayText.value.trim()]].forEach(([k, v]) => {
      const row = document.createElement("div");
      const b = document.createElement("b");
      b.textContent = v;
      row.append(k + ": ", b);
      s.appendChild(row);
    });
    const status = document.getElementById("status");
    const copyBtn = document.getElementById("copyBtn");
    status.className = "status";
    status.textContent = "Sending your answer…";
    copyBtn.hidden = true;
    go("s-end");
    confetti();

    const ok = await saveAnswer({
      coming: true,
      saidNoFirst: state.saidNo,
      food: foodLabel(),
      day: dayText.value.trim()
    });
    if (ok) {
      status.className = "status ok";
      status.textContent = "✓ Your answer has been sent to me 💌";
    } else {
      status.textContent = "Couldn't send it automatically — copy it and send it to me:";
      copyBtn.hidden = false;
    }
  }

  async function copySummary() {
    const btn = document.getElementById("copyBtn");
    try {
      await navigator.clipboard.writeText(summaryText());
      btn.textContent = "Copied! Send it to me 💌";
    } catch (e) {
      btn.textContent = "Couldn't copy — just tell me 😊";
    }
  }

  function confetti() {
    const box = document.getElementById("confetti");
    const items = ["🎉", "❤️", "✨", "🥟", "🍕", "💕"];
    for (let i = 0; i < 36; i++) {
      const sp = document.createElement("span");
      sp.textContent = items[i % items.length];
      sp.style.left = Math.random() * 100 + "vw";
      sp.style.animationDuration = 2.5 + Math.random() * 2 + "s";
      sp.style.animationDelay = Math.random() * .8 + "s";
      box.appendChild(sp);
      setTimeout(() => sp.remove(), 5000);
    }
  }

  function restart() {
    state.food = null;
    state.saidNo = false;
    opts.forEach(x => x.classList.remove("selected"));
    otherBox.classList.remove("show");
    otherText.value = "";
    dayText.value = "";
    foodNext.disabled = true;
    dayNext.disabled = true;
    document.getElementById("copyBtn").textContent = "Copy my answer";
    go("s-start");
  }

</script>
</body>
</html>
